<section id="scan-modal" class="inline-camera" aria-labelledby="scanner-title" data-lookup="{{ url_for('scan_product', barcode='__CODE__') }}" data-product="{{ url_for('view_product', product_id=0) }}" hidden>
  <div class="scanner-heading"><h2 id="scanner-title">Scan tag</h2><button class="scanner-close" type="button" data-camera-close data-close-scanner aria-label="Close scanner">×</button></div>
  <div class="scanner-viewfinder"><video id="scan-video" playsinline muted autoplay aria-label="Camera preview; tap to focus"></video><div class="scanner-crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <p id="scan-status" class="scanner-status" role="status" aria-live="polite">Opening camera…</p>
  <details id="scan-fallback"><summary>Photo or code</summary><label class="scanner-photo-label">Choose a photo<input type="file" id="qr-upload" accept="image/jpeg,image/png,image/webp"></label><label for="scan-manual">Product code</label><input id="scan-manual" type="text" autocomplete="off" enterkeyhint="search" placeholder="Enter code and press Enter" spellcheck="false"></details>
</section>
